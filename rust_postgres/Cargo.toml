[package]
name = "rust_postgres"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "main"
path = "src/main.rs"

[dependencies]
time = "0.3.47"
dotenvy = "0.15.7"
serde = { version = "1.0.228", features = ["derive"] }
sqlx = { version = "0.9.0", features = [
	"postgres",
	"runtime-tokio",
	"tls-rustls",
] }
tokio = { version = "1.52.3", features = ["full"] }
